<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قافلة المبرمجين الصغار — برمج جمّول وأنقذ الكنز</title>
<meta name="description" content="لعبة برمجة للأطفال (٦–١٢ سنة): برمج الجمل الآلي جمّول، تعلّم التسلسل والحلقات وإصلاح الأخطاء والنظام الثنائي. نادي الحاسب.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../pd/fonts/fonts.css">
<link rel="stylesheet" href="../shared/kids.css">
<style>
.hero-title{font-size:44px;color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.35);text-align:center}
.hero-sub{font-size:26px;text-align:center}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.worlds{display:flex;flex-direction:column;gap:14px}
.world{background:rgba(20,15,60,.62);border:3px solid rgba(255,255,255,.2);border-radius:26px;padding:12px 16px}
.world h3{font-size:26px;color:var(--gold);display:flex;gap:10px;align-items:center;margin-bottom:6px}
.world p{margin:0 0 8px;font-size:19px;opacity:.85}
.lvls{display:flex;gap:12px;flex-wrap:wrap}
.lv{width:92px;min-height:96px;background:var(--cream);color:var(--ink);border:4px solid var(--gold);border-radius:22px;box-shadow:0 7px 0 rgba(0,0,0,.22);font-family:var(--head);font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1}
.lv small{font-size:20px;letter-spacing:1px;font-family:var(--body)}
.lv:active{transform:translateY(5px)}
.lv.next{border-color:var(--cyan);animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 7px 0 rgba(0,0,0,.22),0 0 26px 6px rgba(34,230,255,.65)}}
.alistrip{display:flex;gap:12px;align-items:center}
.alistrip .art{width:82px;height:94px;flex:none}
.alistrip .bubble{flex:1;font-size:21px;padding:10px 16px}
.play{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:10px}
@media (max-width:820px){.play{grid-template-columns:1fr}}
.boardwrap{display:flex;justify-content:center}
.board{--cs:min(66px,calc((min(100vw - 56px,520px)) / var(--cols)));position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--cs));grid-auto-rows:var(--cs);direction:ltr;border:6px solid var(--gold);border-radius:20px;overflow:hidden;background:#e6c98c;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.cell{position:relative;display:grid;place-items:center}
.cell:nth-child(odd){background:#ecd39b}.cell:nth-child(even){background:#e3c487}
.cell.rock{background:#5d4a8f}
.cell .art{width:88%;height:88%}
.cell.start::after{content:'🚩';position:absolute;top:1px;left:3px;font-size:calc(var(--cs)*.3)}
.cell .gem{animation:bounce 1.6s infinite}
.cell .chest.open{animation:wiggle .6s 2}
.bot{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);transition:transform .34s ease-in-out;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.bot .art{width:92%;height:92%;margin:4%}
.bot.bumpfx{animation:shake .4s}
.side2{display:flex;flex-direction:column;gap:12px;min-width:0}
.proghead{display:flex;justify-content:space-between;align-items:center;font-size:21px}
.progbox{min-height:96px;border:4px dashed rgba(255,255,255,.4);border-radius:22px;padding:10px;background:rgba(255,255,255,.06);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.blk{position:relative;width:70px;height:78px;border-radius:18px;border:4px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;line-height:1;box-shadow:0 5px 0 rgba(0,0,0,.25);color:#fff}
.blk small{font-size:14px;font-family:var(--head);margin-top:2px}
.blk.F{background:#2fbf71}.blk.L{background:#3b8dff}.blk.R{background:#a35bff}
.blk.running{outline:5px solid var(--cyan);transform:scale(1.12);z-index:2}
.blk .x{position:absolute;top:-12px;inset-inline-start:-12px;width:30px;height:30px;border-radius:50%;background:var(--coral);border:3px solid var(--ink);font-size:16px;color:#fff;display:grid;place-items:center;font-family:var(--body)}
.loop{position:relative;border:4px solid var(--ink);border-radius:20px;background:#ff9f1c;padding:8px 8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:96px;box-shadow:0 5px 0 rgba(0,0,0,.25);max-width:100%}
.loop.sel{outline:5px solid var(--cyan)}
.loop.running{outline:5px solid var(--cyan)}
.loop .lh{display:flex;flex-direction:column;align-items:center;font-family:var(--head);color:var(--ink);font-size:20px;line-height:1.1;gap:2px}
.loop .n{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;min-width:50px;height:44px;font-family:var(--head);font-size:26px;display:grid;place-items:center}
.loop .blk{width:58px;height:66px;font-size:28px}
.loop .plus{width:46px;height:58px;border:3px dashed rgba(42,23,69,.6);border-radius:14px;display:grid;place-items:center;font-size:22px;color:var(--ink)}
.loop .x{position:absolute;top:-12px;inset-inline-start:-12px;width:30px;height:30px;border-radius:50%;background:var(--coral);border:3px solid var(--ink);font-size:16px;color:#fff;display:grid;place-items:center;font-family:var(--body)}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pal button{border:4px solid var(--ink);border-radius:20px;min-height:92px;color:#fff;font-family:var(--head);font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.pal button b{font-size:38px;line-height:1;font-weight:400}
.pal button:active{transform:translateY(5px)}
.pal .F{background:#2fbf71}.pal .L{background:#3b8dff}.pal .R{background:#a35bff}.pal .LP{background:#ff9f1c;color:var(--ink)}
.pal button.dis{opacity:.35}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.ctl .btn{flex:1 1 130px;min-height:64px;font-size:23px}
.hintline{font-size:20px;min-height:30px;opacity:.9}
/* binary doors */
.doorscene{display:flex;flex-direction:column;align-items:center;gap:12px}
.arch{width:min(560px,100%);background:linear-gradient(180deg,#6f5ab5,#4b3a8a);border:6px solid var(--gold);border-radius:200px 200px 20px 20px;padding:26px 14px 18px;text-align:center;position:relative;box-shadow:0 10px 0 rgba(0,0,0,.28);overflow:hidden}
.arch::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px);pointer-events:none}
.arch.open{background:linear-gradient(180deg,#fff1a8,#ffc247)}
.sign{position:relative;display:inline-block;background:var(--cream);color:var(--ink);border:5px solid var(--gold2);border-radius:20px;padding:6px 26px;font-family:var(--head);font-size:44px;margin-bottom:10px}
.lamps{position:relative;display:flex;gap:16px;justify-content:center;direction:ltr}
.lampcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.lampcol .val{background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:14px;min-width:54px;text-align:center;font-family:var(--head);font-size:28px}
.lampcol .bit{font-family:var(--head);font-size:34px;color:#fff}
.lampbtn{width:78px;height:118px}
.lampbtn .art{width:100%;height:100%}
.sumline{font-family:var(--head);font-size:34px;direction:ltr;text-align:center;min-height:50px}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.opts .btn{min-width:110px}
.card.lesson{text-align:center;font-size:25px;line-height:1.7}
.cert{background:var(--cream);color:var(--ink);border:10px double var(--gold2);border-radius:20px;padding:22px;text-align:center;max-width:720px;margin:0 auto;box-shadow:0 12px 0 rgba(0,0,0,.25)}
.cert h2{font-size:38px;color:#7a3b00}
.cert .line{border-bottom:3px dotted #9b8a5a;display:inline-block;min-width:240px;height:34px;vertical-align:bottom}
.starsbig{font-size:50px;letter-spacing:6px}
.stafftip{font-size:16px;opacity:.7;text-align:center;margin-top:14px}
@media print{body{background:#fff!important}.sky,.top,.noprint{display:none!important}.cert{box-shadow:none;max-width:none;margin:0}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/kids.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
const E = CaravanEngine;
const { h, $, shuffle, store, sfx, say, sayBtn, ART, art, wait, confetti } = Kids;
Kids.sky(); Kids.initAssets('../assets/');
const app = $('#app');
let prog = store.get('car.prog', {});
const stars = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);
const ali = (mood, st) => art('ali-' + mood, ART.ali(mood), '', st || 'width:100%;height:100%');
const bot = () => art('camelbot', ART.camelbot(), '', 'width:100%;height:100%');

const WORLDS = [
  { id: 'w1', ic: '🧭', name: 'الأوامر الأولى', desc: 'جمّول يفهم أوامر بسيطة: تقدّم ⬆️ ولفّ ↶ ↷. رتّبها بالترتيب الصحيح!', say: 'أنا علي بابا… آسف! 😭 لعبتُ بحاسوب الكهف وخلّطت كل الأوامر! ساعدوا جمّول الجمل الآلي ليصل إلى الكنز: رتّبوا له الأوامر واحدًا بعد الآخر.' },
  { id: 'w2', ic: '🔁', name: 'الحلقات السحرية', desc: 'بدل أن نكتب الأمر عشر مرات، نقول له: كرّر! الحاسوب يحب التكرار.', say: 'هيهي! الطريق صار طويلًا… والحقيبة صغيرة! 🎒 استخدموا قطعة «كرّر» السحرية لتوفّروا القطع.' },
  { id: 'w3', ic: '🐞', name: 'صائد الأخطاء', desc: 'في البرمجة نسمّي الخطأ «بَقّ» 🐞. المبرمج الشاطر يجد الخطأ ويصلحه.', say: 'أوه! أنا خلّطت الأوامر مرة ثانية!! 🙈 كل برنامج هنا فيه خطأ واحد. هل تجدونه وتصلحونه؟' },
  { id: 'w4', ic: '🚪', name: 'الباب الثنائي', desc: 'الحاسوب يفهم لغة اسمها «الثنائي»: الصفر (0) والواحد (1) فقط! سنفتح أبواب الكهف بها.', say: 'آخر باب في الكهف لا يفتحه إلا من يعرف لغة الحاسوب: الصفر (0) والواحد (1)! هل أنتم مستعدون؟' }
];
const levelsOf = w => E.LEVELS.filter(l => l.w === w);
const ALL = [...E.LEVELS.map(l => ({ id: l.id, t: 'lvl' })), ...E.DOORS.map(d => ({ id: d.id, t: 'door' }))];
const doneCount = () => ALL.filter(a => prog[a.id]).length;
const totalStars = () => ALL.reduce((a, x) => a + (prog[x.id] || 0), 0);
const nextId = () => (ALL.find(a => !prog[a.id]) || {}).id;
const setStars = (id, n) => { prog[id] = Math.max(prog[id] || 0, n); store.set('car.prog', prog); };

function bar(title, back) {
  const mute = h('button', { class: 'iconbtn' + (Kids.isMuted() ? ' off' : ''), 'aria-label': 'الصوت', onclick: () => { const m = Kids.toggleMute(); mute.textContent = m ? '🔇' : '🔊'; mute.classList.toggle('off', m); } }, [Kids.isMuted() ? '🔇' : '🔊']);
  return h('div', { class: 'top' }, [back ? h('button', { class: 'iconbtn', 'aria-label': 'رجوع', onclick: () => { sfx.tap(); stopRun(); showMap(); } }, ['🏠']) : null, h('div', { class: 'title' }, [title]), mute]);
}
function strip(mood, text) {
  const bub = h('div', { class: 'bubble' }); bub.append(h('span', null, [text]), sayBtn(text));
  const a = h('div', { class: 'art', html: ali(mood), style: 'width:82px;height:94px;flex:none' });
  const s = h('div', { class: 'alistrip' }, [a, bub]);
  s.set = (m, t, cls) => { a.innerHTML = ali(m); Kids.upgradeArt(a); bub.className = 'bubble ' + (cls || ''); bub.innerHTML = ''; bub.append(h('span', null, [t]), sayBtn(t)); bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop'); };
  return s;
}
let running = false, runToken = 0;
function stopRun() { running = false; runToken++; }

/* ===================== TITLE ===================== */
function showTitle() {
  stopRun(); app.innerHTML = '';
  const say1 = 'أنا علي بابا… آسف! 😭 لعبتُ بحاسوب الكهف وضاعت كل الأوامر! جمّول الجمل الآلي لا يعرف الطريق إلى الكنز. هل تعلّمونه البرمجة؟';
  app.append(h('div', { class: 'center', style: 'flex:1;justify-content:center' }, [
    h('div', { class: 'hero-sub' }, ['نادي الحاسب يقدّم']),
    h('h1', { class: 'hero-title' }, ['🐪 قافلة المبرمجين الصغار']),
    h('div', { class: 'hero-sub', style: 'color:var(--teal)' }, ['برمج جمّول وأنقذ الكنز!']),
    h('div', { class: 'row', style: 'align-items:flex-end;gap:10px' }, [h('div', { class: 'art', style: 'width:150px;height:172px', html: ali('sad') }), h('div', { class: 'art', style: 'width:130px;height:140px;animation:bounce 1.8s infinite', html: bot() })]),
    h('div', { class: 'bubble', style: 'max-width:640px' }, [h('span', null, [say1]), sayBtn(say1)]),
    h('button', { class: 'btn big', onclick: () => { sfx.ok(); showMap(); } }, ['هيا نبدأ! ✨']),
    h('div', { class: 'stafftip' }, ['لا تحتاج هذه اللعبة إلى إنترنت بعد تحميلها، ولا تجمع أي بيانات'])
  ]));
  Kids.upgradeArt(app);
}

/* ===================== MAP ===================== */
function showMap() {
  stopRun(); app.innerHTML = '';
  const nx = nextId(); const done = doneCount();
  const st = strip(done === ALL.length ? 'happy' : 'sly', done === 0 ? 'اختاروا مرحلة وابدأوا! سأحاول أن أخلّط الأوامر… هيهي 😜' : done === ALL.length ? 'أنتم مبرمجون ماهرون! سأتعلّم منكم يا مبرمجين! 🥹' : 'أحسنتم! أنجزتم ' + done + ' من ' + ALL.length + ' مرحلة. الباقي أصعب… ولكن ممتع! 😎');
  const list = h('div', { class: 'worlds' });
  WORLDS.forEach((w, wi) => {
    const row = h('div', { class: 'lvls' });
    if (w.id !== 'w4') levelsOf(w.id).forEach((l, i) => row.append(h('button', { class: 'lv' + (l.id === nx ? ' next' : ''), onclick: () => { sfx.tap(); playLevel(l, true); } }, [String(i + 1), h('small', null, [prog[l.id] ? stars(prog[l.id]) : '☆☆☆'])])));
    else E.DOORS.forEach((d, i) => row.append(h('button', { class: 'lv' + (d.id === nx ? ' next' : ''), onclick: () => { sfx.tap(); playDoor(d, i, true); } }, [String(i + 1), h('small', null, [prog[d.id] ? stars(prog[d.id]) : '☆☆☆'])])));
    list.append(h('div', { class: 'world' }, [h('h3', null, [w.ic + ' ' + w.name]), h('p', null, [w.desc]), row]));
  });
  app.append(bar('خريطة القافلة 🗺️'), st, h('div', { style: 'height:12px' }), list,
    h('div', { class: 'row', style: 'margin-top:14px' }, [done === ALL.length ? h('button', { class: 'btn big green', onclick: () => { sfx.win(); showCert(); } }, ['🏆 شهادتي']) : null, h('button', { class: 'btn ghost', onclick: showTitle }, ['🏠 البداية'])]));
  Kids.upgradeArt(app);
}

/* ===================== LEVEL ===================== */
function playLevel(L, fresh) {
  stopRun(); app.innerHTML = '';
  const M = L._m || (L._m = E.parse(L));
  const w = WORLDS.find(x => x.id === L.w); const idx = levelsOf(L.w).indexOf(L) + 1;
  let P = L.debug ? JSON.parse(JSON.stringify(L.start)) : []; let target = null; let botDeg = L.d * 90;
  const introText = idx === 1 && !prog[L.id] ? w.say : L.hint;
  const st = strip(idx === 1 && !prog[L.id] ? 'sad' : 'sly', introText);
  const board = h('div', { class: 'board', style: '--cols:' + M.W + ';--rows:' + M.H });
  for (let r = 0; r < M.H; r++) for (let c = 0; c < M.W; c++) {
    const cell = h('div', { class: 'cell' + (M.rocks.has(r + ',' + c) ? ' rock' : '') + (r === M.s[0] && c === M.s[1] ? ' start' : ''), 'data-r': r, 'data-c': c });
    if (M.rocks.has(r + ',' + c)) cell.append(h('span', { class: 'art', html: art('rock', ART.rock(), '', 'width:100%;height:100%') }));
    else if (r === M.goal[0] && c === M.goal[1]) cell.append(h('span', { class: 'art chest', html: art('chest', ART.chest(), '', 'width:100%;height:100%') }));
    else if (M.gems.some(g => g[0] === r && g[1] === c)) cell.append(h('span', { class: 'art gem', html: art('gem', ART.gem(), '', 'width:100%;height:100%') }));
    board.append(cell);
  }
  const botEl = h('div', { class: 'bot', html: bot() }); board.append(botEl);
  const place = (r, c, deg, dx, dy) => { botEl.style.transform = 'translate(calc(var(--cs)*' + (c + (dx || 0)) + '),calc(var(--cs)*' + (r + (dy || 0)) + ')) rotate(' + deg + 'deg)'; };
  const resetBot = () => { botDeg = L.d * 90; place(M.s[0], M.s[1], botDeg); board.querySelectorAll('.gem').forEach(g => g.style.display = ''); board.querySelectorAll('.chest').forEach(c => c.classList.remove('open')); };

  const box = h('div', { class: 'progbox' }); const cnt = h('span'); const hint = h('div', { class: 'hintline' });
  const palBtn = (cls, ic, lb, fn) => h('button', { class: cls, onclick: () => { if (running) return; fn(); } }, [h('b', null, [ic]), lb]);
  const cyc = { F: 'L', L: 'R', R: 'F' };
  const used = () => E.count(P);
  const nSet = [2, 3, 4, 5, 6];
  function addCmd(c) {
    if (used() >= L.max) { sfx.no(); hint.textContent = '🎒 الحقيبة ممتلئة! أقصى عدد من القطع: ' + L.max; hit(box, 'shake'); return; }
    sfx.tap();
    if (target !== null && P[target] && typeof P[target] !== 'string') { if (P[target].b.length >= 6) { sfx.no(); hint.textContent = 'الحلقة ممتلئة!'; return; } P[target].b.push(c); } else P.push(c);
    draw();
  }
  function addLoop() {
    if (used() >= L.max) { sfx.no(); hint.textContent = '🎒 الحقيبة ممتلئة! أقصى عدد من القطع: ' + L.max; hit(box, 'shake'); return; }
    sfx.tap(); P.push({ n: 2, b: [] }); target = P.length - 1; draw();
  }
  const sym = { F: ['⬆️', 'تقدّم'], L: ['↶', 'يسار'], R: ['↷', 'يمين'] };
  function blk(c, pathStr, onTap, onDel) {
    const b = h('div', { class: 'blk ' + c, 'data-p': pathStr, onclick: ev => { ev.stopPropagation(); if (!running) { sfx.tap(); onTap(); } } }, [sym[c][0], h('small', null, [sym[c][1]])]);
    b.append(h('span', { class: 'x', onclick: ev => { ev.stopPropagation(); if (!running) { sfx.tap(); onDel(); } } }, ['✕']));
    return b;
  }
  function draw() {
    box.innerHTML = '';
    box.onclick = () => { if (!running && target !== null) { target = null; draw(); } };
    P.forEach((b, i) => {
      if (typeof b === 'string') box.append(blk(b, String(i), () => { P[i] = cyc[b]; draw(); }, () => { P.splice(i, 1); if (target === i) target = null; else if (target !== null && target > i) target--; draw(); }));
      else {
        const lp = h('div', { class: 'loop' + (target === i ? ' sel' : ''), 'data-l': i, onclick: ev => { ev.stopPropagation(); if (!running) { sfx.tap(); target = target === i ? null : i; draw(); } } });
        lp.append(h('div', { class: 'lh' }, ['🔁 كرّر', h('div', { class: 'n', onclick: ev => { ev.stopPropagation(); if (!running) { sfx.tap(); b.n = nSet[(nSet.indexOf(b.n) + 1) % nSet.length]; draw(); } } }, ['×' + b.n])]));
        b.b.forEach((c, j) => lp.append(blk(c, i + '.' + j, () => { b.b[j] = cyc[c]; draw(); }, () => { b.b.splice(j, 1); draw(); })));
        if (target === i) lp.append(h('div', { class: 'plus' }, ['＋']));
        lp.append(h('span', { class: 'x', onclick: ev => { ev.stopPropagation(); if (!running) { sfx.tap(); P.splice(i, 1); if (target === i) target = null; else if (target !== null && target > i) target--; draw(); } } }, ['✕']));
        box.append(lp);
      }
    });
    if (!P.length) box.append(h('div', { style: 'opacity:.6;font-size:20px;padding:20px 8px' }, ['اضغط على الأوامر في الأسفل لتضعها هنا 👇']));
    cnt.textContent = '🎒 القطع: ' + used() + ' / ' + L.max;
    pal.querySelectorAll('button').forEach(b => b.classList.toggle('dis', used() >= L.max));
  }
  const pal = h('div', { class: 'pal', style: L.loops ? '' : 'grid-template-columns:repeat(3,1fr)' }, [palBtn('F', '⬆️', 'تقدّم', () => addCmd('F')), palBtn('L', '↶', 'لفّ يسار', () => addCmd('L')), palBtn('R', '↷', 'لفّ يمين', () => addCmd('R')),
    L.loops ? palBtn('LP', '🔁', 'كرّر', addLoop) : null]);

  const runBtn = h('button', { class: 'btn green', onclick: () => run() }, ['▶ شغّل']);
  const ctl = h('div', { class: 'ctl' }, [runBtn,
    h('button', { class: 'btn teal', onclick: () => { if (running) return; sfx.tap(); resetBot(); hint.textContent = ''; } }, ['↩ من البداية']),
    h('button', { class: 'btn coral', onclick: () => { if (running) return; sfx.tap(); P = L.debug ? JSON.parse(JSON.stringify(L.start)) : []; target = null; resetBot(); draw(); } }, [L.debug ? '🐞 البرنامج الأصلي' : '🗑️ امسح']),
    h('button', { class: 'btn ghost', onclick: () => { sfx.tap(); st.set('happy', L.hint); } }, ['💡 تلميح'])]);

  app.append(bar(w.ic + ' ' + w.name + ' — ' + idx, true), st,
    h('div', { class: 'play' }, [h('div', { class: 'boardwrap' }, [board]), h('div', { class: 'side2' }, [h('div', { class: 'proghead' }, [h('b', null, ['📜 برنامج جمّول']), cnt]), box, hint, pal, ctl])]));
  Kids.upgradeArt(app); resetBot(); draw();

  const hl = (p, l) => { app.querySelectorAll('.running').forEach(e => e.classList.remove('running')); if (p != null) { const b = app.querySelector('.blk[data-p="' + p + '"]'); if (b) b.classList.add('running'); } if (l != null) { const lp = app.querySelector('.loop[data-l="' + l + '"]'); if (lp) lp.classList.add('running'); } };
  async function run() {
    if (running) return; if (!P.length) { sfx.no(); hint.textContent = '📜 ضعوا بعض الأوامر أولًا!'; hit(box, 'shake'); return; }
    running = true; const tok = ++runToken; target = null; draw(); resetBot(); hint.textContent = ''; runBtn.disabled = true;
    const res = E.simulate(L, P);
    for (let i = 1; i < res.tl.length; i++) {
      if (tok !== runToken) return; const s = res.tl[i];
      hl(s.p, s.l);
      if (s.ev === 'bump') {
        sfx.bump(); const dx = (s.bc - s.c) * 0.35, dy = (s.br - s.r) * 0.35; place(s.r, s.c, s.deg, dx, dy); await wait(220); if (tok !== runToken) return; place(s.r, s.c, s.deg); botEl.classList.add('bumpfx'); await wait(450); botEl.classList.remove('bumpfx'); break;
      }
      place(s.r, s.c, s.deg); if (s.ev === null || s.ev === 'gem' || s.ev === 'win') { if (s.p != null && (s.r !== res.tl[i - 1].r || s.c !== res.tl[i - 1].c)) sfx.step(); }
      await wait(380); if (tok !== runToken) return;
      if (s.ev === 'gem' || s.gem) { sfx.gem(); const g = board.querySelector('.cell[data-r="' + s.r + '"][data-c="' + s.c + '"] .gem'); if (g) g.style.display = 'none'; }
    }
    if (tok !== runToken) return; hl(null, null); running = false; runBtn.disabled = false;
    if (res.ok) {
      board.querySelector('.chest').classList.add('open'); botEl.classList.add('bounce');
      const u = used(); const n = u <= L.par ? 3 : u <= L.par + 2 ? 2 : 1; setStars(L.id, n); sfx.win(); confetti(34);
      const nxt = nextLevel(L.id);
      await wait(700); winModal({ stars: n, par: L.par, used: u, say: L.debug ? 'أصلحتم الخطأ! أنتم صيّادو أخطاء ماهرون 🐞' : 'يا سلام! وصل جمّول إلى الكنز! أنتم مبرمجون رائعون! 🎉', again: () => playLevel(L), next: nxt });
    } else {
      sfx.no();
      const msg = res.reason === 'bump' ? 'اصطدم جمّول بصخرة 🪨 أو بحافة الأرض! جرّبوا برنامجًا آخر.' : res.reason === 'gems' ? 'وصل جمّول إلى الكنز لكن نسي الجواهر 💎! اجمعوها أولًا.' : 'توقّف جمّول قبل أن يصل للكنز 🐪 زيدوا أوامر أو غيّروها.';
      st.set('laugh', 'هاهاها! ' + msg + ' (ولا تقلقوا، المحاولة مجانية)', 'bad'); hint.textContent = '';
      await wait(900); if (tok === runToken) resetBot();
    }
  }
}
const hit = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
function nextLevel(id) { const i = ALL.findIndex(a => a.id === id); return ALL[i + 1] || null; }
function openById(a) { if (!a) return showMap(); if (a.t === 'lvl') playLevel(E.LEVELS.find(l => l.id === a.id)); else playDoor(E.DOORS.find(d => d.id === a.id), E.DOORS.findIndex(d => d.id === a.id)); }

function winModal(o) {
  const m = h('div', { class: 'modal' }, [h('div', { class: 'box card' }, [
    h('div', { class: 'starsbig' }, [stars(o.stars)]), h('h2', null, ['أحسنتم! 🎉']),
    h('div', { style: 'font-size:23px;margin-bottom:8px' }, [o.say, sayBtn(o.say)]),
    o.par ? h('div', { style: 'font-size:19px;opacity:.8;margin-bottom:10px' }, ['استخدمتم ' + o.used + ' قطعة (الأفضل: ' + o.par + ')' + (o.stars < 3 ? ' — جرّبوا برنامجًا أقصر لتحصلوا على ⭐⭐⭐' : '')]) : null,
    h('div', { class: 'row' }, [h('button', { class: 'btn green', onclick: () => { m.remove(); sfx.tap(); openById(o.next); } }, [o.next ? 'المرحلة التالية ➜' : 'إلى الخريطة 🗺️']),
      h('button', { class: 'btn teal', onclick: () => { m.remove(); o.again(); } }, ['🔁 مرة أخرى']), h('button', { class: 'btn ghost', style: 'color:var(--ink);background:#eee', onclick: () => { m.remove(); showMap(); } }, ['🗺️ الخريطة'])])])]);
  document.body.append(m);
}

/* ===================== BINARY DOORS ===================== */
function playDoor(D, i, fresh) {
  stopRun(); app.innerHTML = '';
  const w = WORLDS[3];
  const first = i === 0 && !prog[D.id];
  const st = strip(first ? 'sly' : 'sly', first ? w.say : D.hint);
  const bits = D.type === 'read' ? D.bits.slice() : D.vals.map(() => 0);
  let wrong = 0, locked = false;
  const sign = h('div', { class: 'sign' }); const lamps = h('div', { class: 'lamps' }); const sum = h('div', { class: 'sumline' });
  const arch = h('div', { class: 'arch' }, [sign, lamps]);
  const calc = () => bits.reduce((a, b, k) => a + b * D.vals[k], 0);
  function draw() {
    sign.textContent = D.type === 'make' ? '🔢 الرقم: ' + D.target : '🔢 ما هذا الرقم؟';
    lamps.innerHTML = '';
    D.vals.forEach((v, k) => lamps.append(h('div', { class: 'lampcol' }, [h('div', { class: 'val' }, [String(v)]),
      h('button', { class: 'lampbtn', 'aria-label': 'فانوس ' + v, onclick: () => { if (D.type !== 'make' || locked) return; sfx.tap(); bits[k] ^= 1; if (bits[k]) sfx.gem(); draw(); } }, [h('span', { class: 'art', html: art('lantern-' + (bits[k] ? 'on' : 'off'), ART.lantern(!!bits[k]), '', 'width:100%;height:100%') })]),
      h('div', { class: 'bit' }, [String(bits[k])])])));
    const lit = D.vals.filter((v, k) => bits[k]);
    sum.textContent = D.type === 'make' ? (lit.length ? lit.join(' + ') + ' = ' + calc() : 'المجموع = 0') : '';
    Kids.upgradeArt(lamps);
  }
  const zone = h('div', { class: 'doorscene' }, [arch, sum]);
  const actions = h('div', { class: 'row' });
  function done() {
    locked = true; arch.classList.add('open'); sign.textContent = '🚪 انفتح الباب!'; sfx.win(); confetti(34);
    const n = wrong === 0 ? 3 : wrong === 1 ? 2 : 1; setStars(D.id, n);
    const nxt = nextLevel(D.id);
    setTimeout(() => winModal({ stars: n, say: i === E.DOORS.length - 1 ? 'فتحتم باب النادي الكبير! أنتم تتكلمون لغة الحاسوب الآن: 0 و1! 💻' : 'أحسنتم! الفوانيس المضيئة تجمع الرقم المطلوب.', again: () => playDoor(D, i), next: nxt }), 900);
  }
  if (D.type === 'make') {
    actions.append(h('button', { class: 'btn big green', onclick: () => { if (locked) return; sfx.tap(); if (calc() === D.target) done(); else { wrong++; sfx.no(); hit(arch, 'shake'); st.set('laugh', 'هاهاها! الباب ما زال مغلقًا! مجموعكم الآن ' + calc() + ' لا ' + D.target + ' 😜', 'bad'); } } }, ['🚪 افتح الباب'])
      , h('button', { class: 'btn ghost', onclick: () => { if (locked) return; sfx.tap(); bits.fill(0); draw(); } }, ['🌑 أطفئ الكل']));
  } else {
    D.options.slice().sort(() => Math.random() - .5).forEach(o => actions.append(h('button', { class: 'btn big', onclick: ev => { if (locked) return; sfx.tap(); const right = D.bits.reduce((a, b, k) => a + b * D.vals[k], 0); if (o === right) { sfx.ok(); sign.textContent = '🔢 ' + o; sum.textContent = D.vals.filter((v, k) => bits[k]).join(' + ') + ' = ' + o; done(); } else { wrong++; sfx.no(); hit(arch, 'shake'); st.set('laugh', 'هاهاها! ليس ' + o + '! اجمعوا قيم الفوانيس المضيئة فقط.', 'bad'); } } }, [String(o)])));
  }
  const lesson = (first && D.id === 'd1') ? h('div', { class: 'card lesson' }, ['💡 الحاسوب يفهم شيئين فقط: ', h('b', null, ['مضيء = 1']), ' ، ', h('b', null, ['مطفأ = 0']), ' . لكل فانوس قيمة (4 ، 2 ، 1). نجمع قيم الفوانيس المضيئة لنصنع أي رقم!']) : null;
  app.append(bar('🚪 الباب الثنائي — ' + (i + 1), true), st, h('div', { style: 'height:10px' }), lesson, h('div', { style: 'height:10px' }), zone, h('div', { style: 'height:6px' }), actions,
    h('div', { class: 'row', style: 'margin-top:12px' }, [h('button', { class: 'btn ghost', onclick: () => { sfx.tap(); st.set('happy', D.hint); } }, ['💡 تلميح'])]));
  Kids.upgradeArt(app); draw();
}

/* ===================== CERTIFICATE ===================== */
function showCert() {
  stopRun(); app.innerHTML = ''; confetti(60);
  const tot = totalStars(), max = ALL.length * 3;
  app.append(bar('🏆 شهادة المبرمج الصغير', true), h('div', { class: 'cert pop', style: 'margin-top:14px' }, [
    h('div', { style: 'font-size:22px;color:#7a3b00' }, ['نادي الحاسب · قافلة المبرمجين الصغار']),
    h('h2', null, ['شهادة المبرمج الصغير']),
    h('div', { class: 'row', style: 'align-items:flex-end;margin:8px 0' }, [h('div', { class: 'art', style: 'width:130px;height:150px', html: ali('happy') }), h('div', { class: 'art', style: 'width:110px;height:120px', html: bot() })]),
    h('div', { style: 'font-size:28px' }, ['تُمنح إلى المبرمج/ة: ', h('span', { class: 'line' })]),
    h('div', { style: 'font-size:23px;margin:10px 0;line-height:1.9' }, ['لأنه برمج جمّول بالأوامر ⬆️↶↷ · وعرف 🔁 الحلقات', h('br'), 'وأصلح الأخطاء 🐞 · وفتح الأبواب بلغة الحاسوب 0️⃣1️⃣']),
    h('div', { class: 'starsbig' }, [stars(tot >= max * .85 ? 3 : tot >= max * .6 ? 2 : 1)]),
    h('div', { style: 'font-size:18px;margin-top:6px;color:#7a3b00' }, ['التاريخ: ', h('span', { class: 'line', style: 'min-width:140px' })])])
  , h('div', { class: 'row noprint', style: 'margin-top:14px' }, [h('button', { class: 'btn big green', onclick: () => window.print() }, ['🖨️ اطبع الشهادة']), h('button', { class: 'btn ghost', onclick: showMap }, ['🗺️ للخريطة']), h('button', { class: 'btn ghost', onclick: () => { prog = {}; store.set('car.prog', prog); showMap(); } }, ['🔁 نلعب من جديد'])]));
  Kids.upgradeArt(app);
}

showTitle();
