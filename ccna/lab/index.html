<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HexNet Lab</title>
<meta name="description" content="LINK UP: a Cisco network simulator in your browser for the Computer Club CCNA Fundamentals workshop.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>/* HexNet Lab · LINK UP design system (Night Ops, single dark theme by design) */
:root{
  --void:#050A18;--deck:#0B1532;--deck-2:#112048;--rule:#21346A;--ice:#E8EFFF;--mist:#93A5D3;
  --signal:#4A7DFF;--signal-fill:#2350D8;--flux:#3CC8FF;--silver:#C9D6EC;--on-signal:#FFFFFF;
  --up:#2EE59D;--wait:#FFB547;--down:#FF5A6E;--dhcp:#B59CFF;--dns:#FF86CB;--well:#02050D;
  --font-display:"Oxanium","Chakra Petch",system-ui,sans-serif;--font-sans:"IBM Plex Sans",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--font-ar:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r-xs:2px;--r-sm:6px;--r-md:10px;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ice);font:14px/1.5 var(--font-sans);overflow:hidden}
button{font:inherit;color:inherit}
code,pre,kbd{font-family:var(--font-mono)}
code{background:var(--deck-2);border:1px solid var(--rule);border-radius:var(--r-xs);padding:0 4px;font-size:.92em;color:var(--silver)}
pre{background:var(--well);border:1px solid var(--rule);border-radius:var(--r-sm);padding:8px 10px;margin:8px 0 0;font-size:12.5px;line-height:1.5;color:#D7E3FF;overflow-x:auto;white-space:pre}
:focus-visible{outline:2px solid var(--flux);outline-offset:2px}
.t-up{color:var(--up);font-weight:600}.t-down{color:var(--down);font-weight:600}.t-arp{color:var(--wait);font-weight:600}.t-tcp{color:var(--up);font-weight:600}

#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--deck);border-bottom:1px solid var(--rule);min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand b{font:800 18px/1 var(--font-display);letter-spacing:.02em}
.brand .lu{font:700 11px/1 var(--font-display);letter-spacing:.12em;color:var(--mist);display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);border-radius:var(--r-xs);padding:4px 7px}
.tri{display:inline-block;width:9px;height:8px;background:var(--up);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tri.down{background:var(--down)}.tri.wait{background:var(--wait)}
.mission-pick{display:flex;align-items:center;gap:10px;background:var(--deck-2);border:1px solid var(--rule);border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;min-width:0;max-width:360px}
.mission-pick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mission-pick small{font:600 11px/1 var(--font-display);letter-spacing:.14em;color:var(--flux);flex:none}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:10px;flex:none}
.rank{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.rank i{width:22px;height:22px;display:grid;place-items:center;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:var(--signal-fill);color:#fff;font-style:normal;font-size:11px}
.xpbar{width:120px;height:6px;background:var(--deck-2);border-radius:999px;overflow:hidden;border:1px solid var(--rule)}
.xpbar b{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--flux));width:0;transition:width .6s}
.xpnum{font:600 12px var(--font-mono);color:var(--mist);min-width:62px;text-align:right}
.seg{display:flex;border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden;flex:none}
.seg button{background:transparent;border:0;padding:7px 12px;font:600 12px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--mist);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--signal-fill);color:#fff}
.iconbtn{background:transparent;border:1px solid var(--rule);border-radius:var(--r-sm);width:34px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ice);flex:none}
.iconbtn:hover{border-color:var(--flux)}
/* ---------- body ---------- */
.body{display:grid;grid-template-columns:minmax(300px,360px) 1fr auto;min-height:0}
.dock{background:var(--deck);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;min-width:0}
.dock .scroll{overflow-y:auto;padding:16px 18px 24px;flex:1;min-height:0}
.eyebrow{font:600 11px/1.2 var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--flux)}
.dock h1{font:700 26px/1.1 var(--font-display);margin:6px 0 6px;text-wrap:balance}
.goal{color:var(--mist);margin:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:600 11.5px/1.3 var(--font-mono);background:var(--deck-2);color:var(--ice);border:1px solid var(--rule)}
.brief{border-top:1px solid var(--rule);margin-top:14px;padding-top:10px}
.brief p{margin:8px 0}
.brief ul{padding-left:18px;margin:6px 0}
.sec-h{font:600 11px/1 var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--mist);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--rule)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:8px}
ol.steps li::before{content:counter(s);font:700 12px/24px var(--font-display);text-align:center;width:24px;height:24px;border:1px solid var(--rule);border-radius:var(--r-xs);color:var(--flux)}
ol.steps h4{margin:2px 0 2px;font:600 14px/1.3 var(--font-sans)}
ol.steps div{min-width:0}
.quiz{background:var(--deck-2);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px;margin-bottom:10px}
.quiz p{margin:0 0 8px;font-weight:600}
.quiz .opts{display:grid;gap:6px}
.quiz button{text-align:left;background:var(--deck);border:1px solid var(--rule);border-radius:var(--r-sm);padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.quiz button:hover{border-color:var(--flux)}
.quiz button.ok{border-color:var(--up);color:var(--up)}
.quiz button.no{border-color:var(--down);color:var(--down)}
.quiz .why{margin:8px 0 0;font-size:13px;color:var(--mist)}
.hint{background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.35);border-radius:var(--r-sm);padding:8px 10px;margin:8px 0;font-size:13px}
.btn{font:600 12.5px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;border-radius:var(--r-sm);padding:11px 14px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--signal-fill);color:#fff}
.btn.primary:hover{background:#2a5cf0}
.btn.ghost{background:transparent;color:var(--flux);border-color:var(--flux)}
.btn.quiet{background:var(--deck-2);color:var(--ice);border-color:var(--rule)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.dockfoot{border-top:1px solid var(--rule);padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;background:var(--deck)}
.comp{display:flex;align-items:center;gap:10px;font:600 12px var(--font-mono);color:var(--mist)}
.comp .bar{flex:1;height:8px;border-radius:999px;background:var(--deck-2);border:1px solid var(--rule);overflow:hidden}
.comp .bar b{display:block;height:100%;width:0;background:var(--up);transition:width .5s}
.dockfoot .row{display:flex;gap:8px}
.dockfoot .row .btn{flex:1}
/* ---------- stage ---------- */
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:
  radial-gradient(ellipse at 50% 40%,rgba(35,80,216,.10),transparent 60%),var(--void)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#cv.placing,#cv.cabling{cursor:crosshair}
#cv.deleting{cursor:not-allowed}
.node{cursor:pointer}
.node text{font:600 12px var(--font-mono);fill:var(--ice);text-anchor:middle;paint-order:stroke;stroke:var(--void);stroke-width:4px}
.node .ring{fill:transparent;stroke:transparent;stroke-width:1.5}
.node:hover .ring,.node.sel .ring{stroke:var(--flux)}
.node.src .ring{stroke:var(--wait);stroke-dasharray:4 3}
.note{font:600 11px var(--font-display);letter-spacing:.16em;fill:var(--mist);text-anchor:middle}
.lk{stroke:#7F93C4;stroke-width:2.2;fill:none}
.lk.cross{stroke-dasharray:7 5}
.lk.console{stroke:var(--flux);stroke-dasharray:2 4;stroke-width:2}
.lk.hot{stroke:var(--flux)}
.lkhit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.plabel{font:500 10px var(--font-mono);fill:var(--mist);paint-order:stroke;stroke:var(--void);stroke-width:3px}
.pkt rect{stroke:rgba(5,10,24,.8);stroke-width:1}
.hud{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.toolhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--deck);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--ice);z-index:3;display:flex;gap:8px;align-items:center;max-width:calc(100% - 120px)}
.toolhint kbd{font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 4px;color:var(--mist)}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:12px;font:500 11px var(--font-mono);color:var(--mist);z-index:2;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--deck);border:1px solid var(--up);border-radius:var(--r-md);padding:10px 16px;z-index:40;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-weight:500;max-width:90%}
.toast.bad{border-color:var(--down)}
/* ---------- palette ---------- */
.palette{display:flex;align-items:stretch;gap:0;background:var(--deck);border-top:1px solid var(--rule);min-height:92px;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.pgroup{display:flex;flex-direction:column;gap:6px;padding:8px 14px;border-right:1px solid var(--rule);flex:none}
.pgroup h5{margin:0;font:600 10px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.pitems{display:flex;gap:6px}
.pitem{width:64px;height:58px;display:grid;justify-items:center;align-content:center;gap:2px;background:transparent;border:1px solid transparent;border-radius:var(--r-sm);cursor:pointer;font:500 10px/1.1 var(--font-mono);color:var(--mist);touch-action:none}
.pitem svg{width:34px;height:34px}
.pitem:hover{border-color:var(--rule);color:var(--ice)}
.pitem[aria-pressed="true"]{border-color:var(--flux);background:var(--deck-2);color:var(--ice)}
.cable-ic{width:34px;height:34px;display:grid;place-items:center}
/* ---------- simulation panel ---------- */
.simpanel{width:330px;background:var(--deck);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.simpanel header{padding:12px 14px 10px;border-bottom:1px solid var(--rule)}
.simpanel h3{margin:0;font:700 15px var(--font-display);letter-spacing:.04em}
.simctl{display:flex;gap:6px;margin-top:10px;align-items:center}
.simctl .btn{padding:8px 10px}
.filters{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.filters label{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--font-mono);border:1px solid var(--rule);border-radius:var(--r-xs);padding:3px 6px;cursor:pointer}
.filters input{accent-color:var(--flux);margin:0}
.evlist{overflow-y:auto;flex:1;min-height:0}
.evlist table{width:100%;border-collapse:collapse;font:12px var(--font-mono)}
.evlist th{position:sticky;top:0;background:var(--deck);text-align:left;font:600 10px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--mist);padding:8px 8px;border-bottom:1px solid var(--rule)}
.evlist td{padding:6px 8px;border-bottom:1px solid rgba(33,52,106,.5);white-space:nowrap}
.evlist tr{cursor:pointer}
.evlist tbody tr:hover td{background:var(--deck-2)}
.evlist tr.cur td{background:rgba(60,200,255,.10)}
.evlist tr.drop td{color:var(--down)}
.sw{display:inline-block;width:12px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.simstat{padding:8px 14px;border-top:1px solid var(--rule);font:12px var(--font-mono);color:var(--mist);display:flex;justify-content:space-between}
/* ---------- windows ---------- */
#wins{position:absolute;inset:0;pointer-events:none;z-index:10}
.win{position:absolute;pointer-events:auto;background:var(--deck);border:1px solid var(--rule);border-radius:var(--r-md);box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;flex-direction:column;width:min(640px,calc(100% - 24px));height:min(520px,calc(100% - 24px));min-width:300px;min-height:240px;resize:both;overflow:hidden}
.win.focus{border-color:#35529A}
.win .wh{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--rule);cursor:move;background:var(--deck-2);touch-action:none}
.win .wh b{font:700 14px var(--font-display);letter-spacing:.03em}
.win .wh small{color:var(--mist);font:500 11px var(--font-mono)}
.win .wh svg{width:22px;height:22px;flex:none}
.win .x{margin-left:auto;background:transparent;border:1px solid var(--rule);border-radius:var(--r-xs);width:26px;height:26px;cursor:pointer;color:var(--ice);display:grid;place-items:center}
.win .x:hover{border-color:var(--down);color:var(--down)}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--rule)}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 10px;cursor:pointer;color:var(--mist);font:600 12px var(--font-display);letter-spacing:.06em}
.tabs button[aria-selected="true"]{color:var(--ice);border-bottom-color:var(--flux)}
.wb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
/* terminal */
.term{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--well);margin:10px;border:1px solid var(--rule);border-radius:var(--r-sm);font:13px/1.45 var(--font-mono);color:#D7E3FF;cursor:text}
.term .out{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 0;white-space:pre-wrap;word-break:break-word}
.term .out .sys{color:var(--up)}
.term .out .err{color:var(--down)}
.term .ln{display:flex;padding:0 12px 10px;align-items:baseline}
.term .ln .pr{white-space:pre;color:var(--flux)}
.term .ln input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:inherit;padding:0;caret-color:var(--flux)}
.term .ln input:disabled{opacity:.5}
.termbar{display:flex;gap:8px;justify-content:flex-end;padding:0 10px 10px}
.termbar .btn{padding:7px 10px;font-size:11px}
/* desktop apps */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:16px}
.app{display:grid;justify-items:center;gap:8px;padding:16px 8px;background:var(--deck-2);border:1px solid var(--rule);border-radius:var(--r-md);cursor:pointer;text-align:center;font-weight:500}
.app:hover{border-color:var(--flux)}
.app svg{width:40px;height:40px}
.apphead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule)}
.apphead b{font:600 13px var(--font-display);letter-spacing:.04em}
.apphead .x{margin-left:auto}
.form{padding:14px 16px;display:grid;gap:10px;max-width:560px}
.frow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.frow label{color:var(--mist);font-size:13px}
.inp{background:var(--well);border:1px solid #3A4E86;border-radius:var(--r-sm);color:var(--ice);font:13px var(--font-mono);padding:8px 10px;width:100%;min-width:0}
.inp:focus{border-color:var(--flux);outline:0}
.inp.bad{border-color:var(--down)}
.radios{display:flex;gap:16px}
.radios label{display:inline-flex;gap:6px;align-items:center;color:var(--ice)}
.radios input{accent-color:var(--flux)}
.fmsg{font-size:12.5px;color:var(--mist);min-height:18px}
.fmsg.ok{color:var(--up)}.fmsg.bad{color:var(--down)}
.browser{display:flex;flex-direction:column;flex:1;min-height:0}
.urlbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.page{flex:1;overflow:auto;background:#F3F6FC;color:#0A1430;margin:10px;border-radius:var(--r-sm);padding:16px 18px;font-family:Georgia,serif}
.page h1{margin:0 0 8px;font:700 24px var(--font-display);color:#2350D8}
.page.err{background:var(--deck-2);color:var(--mist);font-family:var(--font-sans)}
/* physical */
.phys{padding:14px;display:grid;gap:12px}
.panel{background:#0A1129;border:1px solid var(--rule);border-radius:var(--r-sm);padding:12px}
.panel h6{margin:0 0 8px;font:600 11px var(--font-display);letter-spacing:.14em;color:var(--mist);text-transform:uppercase}
.ports{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.port{display:flex;align-items:center;gap:6px;background:var(--deck-2);border:1px solid var(--rule);border-radius:var(--r-xs);padding:5px 7px;font:11px var(--font-mono);min-width:0}
.port span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.port em{font-style:normal;color:var(--mist);margin-left:auto;font-size:10px}
.svc{display:grid;grid-template-columns:120px 1fr;min-height:0;flex:1}
.svc nav{border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:8px}
.svc nav button{background:transparent;border:0;text-align:left;padding:8px 10px;border-radius:var(--r-xs);cursor:pointer;color:var(--mist);font:600 12px var(--font-display);letter-spacing:.06em}
.svc nav button[aria-selected="true"]{background:var(--deck-2);color:var(--ice)}
.tbl{width:100%;border-collapse:collapse;font:12px var(--font-mono)}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
.tbl th{color:var(--mist);font:600 10px var(--font-display);letter-spacing:.12em;text-transform:uppercase}
.onoff{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden}
.onoff button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font:600 11px var(--font-display);color:var(--mist)}
.onoff button[aria-pressed="true"]{background:var(--signal-fill);color:#fff}
/* PDU */
.osi{display:grid;gap:6px;padding:12px}
.layer{display:grid;grid-template-columns:120px 1fr;gap:10px;background:var(--deck-2);border:1px solid var(--rule);border-radius:var(--r-sm);padding:8px 10px;font:12px var(--font-mono)}
.layer b{font:700 11px var(--font-display);letter-spacing:.1em;color:var(--flux);text-transform:uppercase}
.layer.off{opacity:.4}
.pnote{margin:6px 12px;padding:8px 10px;border-left:2px solid var(--wait);background:rgba(255,181,71,.07);font-size:13px}
.pnote.drop{border-color:var(--down);background:rgba(255,90,110,.08)}
/* popovers & modals */
.pop{position:fixed;z-index:60;background:var(--deck);border:1px solid var(--rule);border-radius:var(--r-md);box-shadow:0 12px 32px rgba(0,0,0,.55);padding:6px;min-width:220px;max-height:min(420px,70vh);overflow-y:auto}
.pop h6{margin:4px 8px 6px;font:600 10px var(--font-display);letter-spacing:.16em;color:var(--mist);text-transform:uppercase}
.pop button{display:flex;width:100%;gap:8px;align-items:center;background:transparent;border:0;padding:6px 8px;border-radius:var(--r-xs);cursor:pointer;text-align:left;font:12.5px var(--font-mono)}
.pop button:hover:not([disabled]){background:var(--deck-2)}
.pop button[disabled]{opacity:.4;cursor:not-allowed}
.pop button em{margin-left:auto;font-style:normal;color:var(--mist);font-size:11px}
.scrim{position:fixed;inset:0;background:rgba(2,5,13,.72);z-index:50;display:grid;place-items:center;padding:16px}

 radial-gradient(ellipse at 80% 0%,rgba(60,200,255,.18),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(35,80,216,.28),transparent 60%),var(--void);border:1px solid var(--rule);border-radius:var(--r-md);padding:24px}

<script>/* HexNet Lab — network engine (no DOM). */
(function (G) {
'use strict';
const HX = G.HX = G.HX || {};

/* ---------------- utils ---------------- */
const ip2n = s => {

/* ---------------- models ---------------- */
function portsFor(kind) {

    for (let i = 0; i <= 2; i++) P.push(['GigabitEthernet0/' + i, 'Gig0/' + i, 'ge']);
    P.push(['Console', 'Console', 'console']);

const isL3 = k => k === 'router' || k === 'isp';

function defaultCfg(dev) {

  for (const p of dev.hw) {
    if (p.type !== 'fe' && p.type !== 'ge') continue;
    c.ifs[p.name] = { admin: dev.kind === 'switch' || isHost(dev.kind), ip: null, mask: null, desc: '' };
    if (dev.kind === 'switch') Object.assign(c.ifs[p.name], { vlan: 1, mode: 'access' });

  if (isHost(dev.kind)) Object.assign(c, { ipMode: 'static', gw: null, dns: null });
  if (dev.kind === 'server') c.services = { http: { on: true, page: '<h1>Welcome</h1><p>Server is up.</p>' }, dns: { on: false, records: [] }, dhcp: { on: false, gw: '', dns: '', start: '', mask: '255.255.255.0', max: 50 } };

    Object.assign(c, { enableSecret: null, enablePassword: null, pwEnc: false, banner: null, con: { password: null, login: false }, vty: { password: null, login: false }, domainLookup: true, domain: null, users: {} });
  }

/* ---------------- device ---------------- */
class Device {
  constructor(net, kind, o = {}) {

    this.x = o.x || 0; this.y = o.y || 0; this.name = o.name || kind;
    this.model = MODEL[kind];

    this.locked = !!o.locked; this.core = !!o.core;

  }
  port(name) { return this.hw.find(p => p.name === name); }
  ethPorts() { return this.hw.filter(p => p.type === 'fe' || p.type === 'ge'); }
  ifc(name) { return this.cfg.ifs[name]; }

  syslog(msg) { for (const s of this.rt.sessions) s.async && s.async(msg); this.net.emit('syslog', { dev: this, msg }); }

  addrs() {
    const out = [];

      const i = this.cfg.ifs.FastEthernet0;
      if (i.ip) out.push({ ip: i.ip, mask: i.mask, ifname: 'FastEthernet0', mac: this.port('FastEthernet0').mac });

      for (const p of this.ethPorts()) { const i = this.ifc(p.name); if (i.ip) out.push({ ip: i.ip, mask: i.mask, ifname: p.name, mac: p.mac }); }
      for (const [n, l] of Object.entries(this.cfg.loops)) if (l.ip) out.push({ ip: l.ip, mask: l.mask, ifname: 'Loopback' + n, mac: null, loop: true });

      const v = this.cfg.svi[1]; if (v && v.ip) out.push({ ip: v.ip, mask: v.mask, ifname: 'Vlan1', mac: this.sviMac() });

  }

}

/* ---------------- net ---------------- */
class Net {
  constructor() {
    this.devices = []; this.links = []; this.listeners = []; this.events = []; this.trace = null;

  }
  on(f) { this.listeners.push(f); }
  emit(t, d) { for (const f of this.listeners) try { f(t, d); } catch (e) { console.error(e); } }
  dev(id) { return this.devices.find(d => d.id === id); }
  byName(n) { n = String(n).toLowerCase(); return this.devices.find(d => d.name.toLowerCase() === n); }
  add(kind, x, y, name, o = {}) {
    if (!name) {
      const base = { pc: 'PC', laptop: 'Laptop', server: 'Server', switch: 'Switch', router: 'Router', isp: 'ISP' }[kind];
      let i = this.counter[kind]; do { name = base + i; i++; } while (this.byName(name)); this.counter[kind] = i;

  }

  /* ---------- L2 segment helpers ---------- */
  /* routers reachable on the same L2 segment as (dev,port) — through switches */
  segmentL3(dev, port) {
    const out = []; const seen = new Set();

      const l = this.linkAt(d.id, p); if (!this.linkUp(l)) return;

  computeOSPF() {
    const R = this.devices.filter(d => isL3(d.kind) && d.cfg.ospf);

      const out = [];
      for (const a of d.addrs()) {

          dist.set(e.dev.id, dist.get(u.id) + 1);
          first.set(e.dev.id, u.id === src.id ? e : first.get(u.id));
          q.push(e.dev);
        }
      }
      const mine = new Set(en.get(src.id).map(a => netN(a.ip, a.mask) + '/' + a.mask));
      const best = {};

        if (id === src.id) continue; const D = this.dev(id);

          const mask = a.loop ? '255.255.255.255' : a.mask;
          const key = netN(a.ip, mask) + '/' + mask; if (mine.has(netN(a.ip, a.mask) + '/' + a.mask) && !a.loop) continue;
          const cost = dd + 1; const f = first.get(id);
          if (!best[key] || best[key].cost > cost) best[key] = { net: n2ip(netN(a.ip, mask)), mask, nh: f.nhIp, ifname: f.ifname, cost, ad: 110, type: 'O' };
        }
      }
      src.rt.ospfRoutes = Object.values(best);
    }
  }

    const rs = [];

      const up = a.loop || this.portUp(d, a.ifname); if (!up) continue;
      rs.push({ type: 'C', net: n2ip(netN(a.ip, a.mask)), mask: a.mask, ifname: a.ifname, ad: 0 });
      rs.push({ type: 'L', net: a.ip, mask: '255.255.255.255', ifname: a.ifname, ad: 0 });
    }

function onNet(type) { if (type === 'state' || type === 'topo') { trackUps(); } }

  sim.rows = []; const eb = $('#evbody'); if (eb) eb.innerHTML = ''; release();
  lab = labDef(id) || HX.LABS[0];

  if (saved) { try { net = HX.Net.from(saved.net); st = Object.assign(freshSt(), saved.st); } catch (e) { console.error(e); net = null; } }
  if (!saved || !net) {
    net = new HX.Net(); lab.build(net);
    for (const d of net.devices) d.core = true; for (const l of net.links) l.core = true;
    net.linkState = {}; net.refresh(); st = freshSt(); net.history = [];
  }

  $('#pal-isp') && ($('#pal-isp').hidden = true);
  render(); fit(); renderDock(); renderXP(); setTool('select'); if (sim.on) setMode(true);
  scheduleCheck(50); saveNow();
  $('#dock').classList.remove('open');
}
